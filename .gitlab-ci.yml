image: mcr.microsoft.com/playwright:v1.55.0-noble

stages:
  - test

web-tests:
  stage: test
  script:
    - npm ci
    - npm run webTests
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/

api-tests:
  stage: test
  script:
    - npm ci
    - npm run APITests
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/